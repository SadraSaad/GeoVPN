name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck nodejs npm jq

      - name: Run linter
        run: ./tools/lint.sh

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch OpenWrt rootfs for ucode runtime (optional)
        run: |
          mkdir -p /tmp/ow-rootfs
          wget -qO- https://downloads.openwrt.org/releases/25.12.5/targets/x86/64/openwrt-25.12.5-x86-64-rootfs.tar.gz | tar -xz -C /tmp/ow-rootfs 2>/dev/null || true

      - name: Run unit test suite
        run: |
          python3 -m unittest discover -s tests/unit -p "test_*.py" -v

  sdk-build:
    name: OpenWrt SDK Build (${{ matrix.package }} on ${{ matrix.version }})
    runs-on: ubuntu-24.04
    needs: unit-tests
    strategy:
      fail-fast: false
      matrix:
        version: ["25.12.5"]
        package:
          - geovpn-core
          - luci-app-geovpn
          - geovpn-wireguard
          - geovpn-ikev2
          - geovpn
          - geovpn-full
          - geovpn-data-seed
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SDK build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential zstd libncurses-dev gawk git subversion libssl-dev diffutils bzip2 wget file python3

      - name: Build packages with SDK
        run: ./tools/build-sdk.sh ${{ matrix.version }} ${{ matrix.package }}

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: geovpn-apk-${{ matrix.version }}-${{ matrix.package }}
          path: out/*.apk
          if-no-files-found: ignore
